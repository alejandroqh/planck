# Shared colors for the MkiP themes. Each palette file next to this one is
# layered on top of it, and both on top of dark-theme.toml, so only the keys
# that differ from the default dark theme live here.

[color-theme.base]
black = "$dark2"
white = "$text"
grey = "$dimmed5"
cyan = "$blue"
magenta = "$purple"
primary-background = "$background"
secondary-background = "$dark1"
current-background = "$dimmed5"
dim-text = "$dimmed3"

[color-theme.syntax]
"comment" = "$dimmed3"
"constant" = "$purple"
"number" = "$purple"
"enumMember" = "$purple"
"enum-member" = "$purple"
"escape" = "$purple"
"string.escape" = "$purple"
"type" = "$blue"
"typeAlias" = "$blue"
"enum" = "$blue"
"struct" = "$blue"
"structure" = "$blue"
"interface" = "$blue"
"class" = "$blue"
"type.builtin" = "$blue"
"builtinType" = "$blue"
"attribute" = "$blue"
"macro" = "$blue"
"constructor" = "$green"
"function" = "$green"
"method" = "$green"
"function.method" = "$green"
"keyword" = "$red"
"operator" = "$red"
"tag" = "$red"
"selfKeyword" = "$dimmed1"
"parameter" = "$orange"
"string" = "$yellow"
"field" = "$text"
"property" = "$text"
"variable" = "$text"
"variable.other.member" = "$text"
"embedded" = "$text"
"punctuation" = "$dimmed2"
"punctuation.delimiter" = "$dimmed2"
"text.title" = "$green"
"text.uri" = "$blue"
"text.reference" = "$orange"

"markup.heading" = "$green"
"markup.bold" = "$orange"
"markup.italic" = "$orange"
"markup.list" = "$red"
"markup.link.url" = "$blue"
"markup.link.label" = "$purple"
"markup.link.text" = "$yellow"
"markup.quote" = "$dimmed2"
"markup.raw" = "$blue"
"markup.strikethrough" = "$dimmed3"
"label" = "$green"
"punctuation.special" = "$red"
"diff.plus" = "$green"
"diff.minus" = "$red"

"bracket.color.1" = "$yellow"
"bracket.color.2" = "$purple"
"bracket.color.3" = "$blue"
"bracket.unpaired" = "$red"

[color-theme.ui]
"planck.border" = "$dark2"
"planck.scroll_bar" = "$dimmed4"
"planck.button.primary.background" = "$green"
"planck.tab.active.underline" = "$yellow"
"planck.tab.inactive.underline" = "$dimmed4"
"planck.plugin.name" = "$text"
"planck.plugin.author" = "$dimmed2"

"editor.focus" = "$dimmed1"
"editor.caret" = "$text"
"editor.current_line" = "$dark1"

"inlay_hint.foreground" = "$dimmed2"
"inlay_hint.background" = "$dark1"

"source_control.added" = "$green"
"source_control.removed" = "$red"
"source_control.modified" = "$orange"

"panel.hovered.background" = "$background"

"markdown.blockquote" = "$dimmed2"

"terminal.bright_white" = "$text"
"terminal.bright_black" = "$dimmed3"
