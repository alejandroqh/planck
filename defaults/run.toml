# Run configurations. Pick one with the "Run" palette and it runs in a terminal.

[[configs]]
# the name of this task
name = "task"

# the program to run, e.g. "${workspace}/target/debug/app"
program = ""

# the program arguments, e.g. args = ["arg1", "arg2"], optional
# args = []

# current working directory, optional
# cwd = "${workspace}"

# environment variables, optional
# [configs.env]
# VAR1 = "VAL1"
# VAR2 = "VAL2"

# task to run before the program starts, optional
# [configs.prelaunch]
# program = "cargo"
# args = [
#   "build",
# ]
