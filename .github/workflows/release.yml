name: Release

# Builds .deb and .rpm for amd64 and arm64 and a macOS arm64 .dmg, then
# publishes them as a GitHub release. A v* tag makes a stable release; running
# it by hand makes the "nightly" prerelease.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release"
        required: false
        default: nightly

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}

env:
  CARGO_TERM_COLOR: always
  # A v* tag builds a Stable binary, anything else a Nightly one (see planck-core/build.rs).
  RELEASE_TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

permissions: {}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04's older glibc keeps the binary working on older distros.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install dependencies
        run: sudo make ubuntu-deps

      - name: Update rust
        run: rustup update --no-self-update

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: |
          cargo build --locked --profile release-lto
          strip target/release-lto/planck

      - name: Package deb and rpm
        run: |
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: planck-linux-${{ runner.arch }}
          path: dist/*
          retention-days: 1

  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Update rust
        run: rustup update --no-self-update

      # shortcut: ad-hoc signed and not notarized, so macOS asks to confirm the
      # first launch; sign with a Developer ID and notarize once there is one.
      - name: Build Planck.dmg
        run: make dmg CODESIGN_IDENTITY=-

      - name: Rename
        run: |
          mkdir dist
          # The in-app updater looks for this name.
          mv target/release-lto/macos/Planck.dmg dist/Planck-macos.dmg

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: planck-macos
          path: dist/*
          retention-days: 1

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

      - name: Publish release
        run: |
          assets=(planck-linux-*/* planck-macos/*)
          prerelease=
          if [ "$RELEASE_TAG_NAME" = nightly ]; then
            prerelease=--prerelease
            gh release delete nightly --yes --cleanup-tag || true
          elif gh release view "$RELEASE_TAG_NAME" >/dev/null 2>&1; then
            # A release made by hand keeps its notes; only the files are added.
            gh release upload "$RELEASE_TAG_NAME" --clobber "${assets[@]}"
            exit 0
          fi
          gh release create "$RELEASE_TAG_NAME" $prerelease \
            --title "$RELEASE_TAG_NAME" --target "$GITHUB_SHA" "${assets[@]}"
