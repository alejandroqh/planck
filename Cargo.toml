[package]
name         = "planck"
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
default-run  = "planck"
description  = "Fast, focused code editor"

[dependencies]
planck-app = { path = "./planck-app" }

# Linux packages, built by .github/workflows/release.yml from the release-lto binary.
[package.metadata.deb]
section = "editors"
extended-description = "Planck is a code editor written in Rust with built-in LSP support, modal editing and a terminal."
assets  = [
    ["target/release-lto/planck", "usr/bin/", "755"],
    ["extra/linux/io.github.alejandroqh.planck.desktop", "usr/share/applications/", "644"],
    ["extra/linux/io.github.alejandroqh.planck.metainfo.xml", "usr/share/metainfo/", "644"],
    ["extra/linux/io.github.alejandroqh.planck.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release-lto/planck", dest = "/usr/bin/planck", mode = "755" },
    { source = "extra/linux/io.github.alejandroqh.planck.desktop", dest = "/usr/share/applications/io.github.alejandroqh.planck.desktop", mode = "644" },
    { source = "extra/linux/io.github.alejandroqh.planck.metainfo.xml", dest = "/usr/share/metainfo/io.github.alejandroqh.planck.metainfo.xml", mode = "644" },
    { source = "extra/linux/io.github.alejandroqh.planck.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.alejandroqh.planck.svg", mode = "644" },
]

[[bin]]
name = "planck"
path = "planck-app/src/bin/planck.rs"

[workspace]
members = ["planck-app", "planck-proxy", "planck-rpc", "planck-core"]
# Vendored libraries keep their own manifests and are not linted or formatted with Planck.
exclude = ["libs"]

[workspace.package]
version      = "1.0.3"
edition      = "2024"
rust-version = "1.98.0"
license      = "Apache-2.0"
homepage     = "https://github.com/alejandroqh/planck"
authors      = ["Alejandro Quintanar", "Dongdong Zhou <dzhou121@gmail.com>"]

[workspace.dependencies]
anyhow            = { version = "1.0" }
backtrace         = { version = "0.3" }
chrono            = { version = "0.4" }
clap              = { version = "4.5.0", default-features = false, features = ["std", "help", "usage", "derive"] }
crossbeam-channel = { version = "0.5.12" }
directories       = { version = "4.0.1" }
flate2            = { version = "1.0" }
git2              = { version = "0.21.0", features = ["vendored-openssl", "vendored-libgit2"] }
globset           = { version = "0.4.14" }
hashbrown         = { version = "0.14.5", features = ["serde"] }
im                = { version = "15.0.0", features = ["serde"] }
include_dir       = { version = "0.7" }
indexmap          = { version = "2.0", features = ["serde"] }
interprocess      = { version = "1.2.1" }
itertools         = { version = "0.12.1" }
notify            = { version = "5.2.0", features = ["serde"] }
once_cell         = { version = "1.19" }
parking_lot       = { version = "0.12.3" }
rayon             = { version = "1.10.0" }
regex             = { version = "1.10.5" }
remain            = { version = "0.2" }
reqwest           = { version = "0.11", features = ["blocking", "json", "socks"] }
serde             = { version = "1.0" }
serde_json        = { version = "1.0" }
smallvec          = { version = "1.15.1" }
strum             = { version = "0.27.1" }
strum_macros      = { version = "0.27.1" }
tar               = { version = "0.4" }
tempfile          = { version = "3.10.1" }
thiserror         = { version = "1.0" }
toml              = { version = "*" }
toml_edit         = { version = "0.20.2", features = ["serde"] }
url               = { version = "2.5.0" }
zstd              = { version = "0.11.2" }

lsp-types = { version = "0.95.1", features = ["proposed"] }                                                  # not following semver, so should be locked to patch version updates only

lapce-xi-rope = { version = "0.3.2", features = ["serde"] }

planck-core  = { path = "./planck-core" }
planck-rpc   = { path = "./planck-rpc" }
planck-proxy = { path = "./planck-proxy" }

[workspace.dependencies.floem]
path = "./libs/floem"
features = ["editor", "serde", "default-image-formats", "rfd-async-std"]

[workspace.dependencies.floem-editor-core]
path = "./libs/floem/editor-core"
features = ["serde"]

[patch.crates-io]
# lsp-types with message-type debug, kept in libs/
lsp-types = { path = "./libs/lsp-types" }

# cargo vendor issue: https://github.com/rust-lang/cargo/issues/10310
# dpi comes from winit (source) and muda (crate)
dpi = { git = "https://github.com/rust-windowing/winit", rev = "ee245c569d65fdeacf705ee5eedb564508d10ebe" }


[workspace.dependencies.tracing]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing"

[workspace.dependencies.tracing-log]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-log"

[workspace.dependencies.tracing-subscriber]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-subscriber"

[workspace.dependencies.tracing-appender]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-appender"

[workspace.dependencies.alacritty_terminal]
git = "https://github.com/alacritty/alacritty"
rev = "cacdb5bb3b72bad2c729227537979d95af75978f"

[workspace.dependencies.windows-sys]
version  = "0"
features = ["Win32_Foundation"]

[profile.release-lto]
inherits      = "release"
lto           = true
codegen-units = 1

# A profile which compiles all (non-workspace) dependencies in release mode
# but Planck code in dev mode. This gives a good debugging experience for your
# code and fast performance of other people's code. After the initial
# build subsequent ones are as fast as dev mode builds.
# See https://doc.rust-lang.org/cargo/reference/profiles.html
# To use this profile:
#   cargo build --profile fastdev
#   cargo run --profile fastdev --bin planck
[profile.fastdev.package."*"]
opt-level = 3

[profile.fastdev]
inherits = "dev"
