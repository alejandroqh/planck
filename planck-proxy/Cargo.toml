[package]
name         = "planck-proxy"
license      = { workspace = true }
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
alacritty_terminal = { workspace = true }
anyhow             = { workspace = true }
crossbeam-channel  = { workspace = true }
directories        = { workspace = true }
git2               = { workspace = true }
globset            = { workspace = true }
indexmap           = { workspace = true }
interprocess       = { workspace = true }
notify             = { workspace = true }
parking_lot        = { workspace = true }
regex              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-log        = { workspace = true }
url                = { workspace = true }

lsp-types = { workspace = true }

lapce-xi-rope     = { workspace = true }
planck-core        = { workspace = true }
planck-rpc         = { workspace = true }
floem-editor-core = { workspace = true }

# proxy specific dependencies

dyn-clone    = "1.0.16"
jsonrpc-lite = "0.6.0"
polling      = "3.5.0"
libc         = "0.2"

# deleting files
trash = "3.0.6"

# search
ignore        = "0.4"
grep-searcher = "0.1"
grep-matcher  = "0.1"
grep-regex    = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3.1"

# alacritty_terminal hands std file descriptors to rustix-openpty's rustix 0.38,
# which only accepts them with its `std` feature. On Linux the desktop crates
# turn it on; on macOS nothing does, so turn it on here.
[target.'cfg(unix)'.dependencies]
rustix-038 = { package = "rustix", version = "0.38", features = ["std"] }
